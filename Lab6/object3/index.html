<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Object3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>

  <div id="titlebar">
    <span>📈</span><span>Object3 — графік y=f(x)</span>
  </div>

  <div class="content">
    <div id="status" class="status">Читаю буфер обміну…</div>
    <canvas id="graphCanvas" width="520" height="320"></canvas>

    <div id="manualFallback" style="display:none; margin-top:10px;">
      <p>Браузер заблокував автоматичне читання буфера обміну.
         Встав дані вручну (Ctrl+V) і натисни кнопку:</p>
      <textarea id="manualInput" rows="4" style="width:100%;"></textarea><br><br>
      <button id="btnBuildManual">Побудувати графік</button>
    </div>

    <button id="btnRetry" style="margin-top:10px;">Прочитати буфер ще раз</button>
  </div>

  <script src="object3.js"></script>
</body>
</html>
