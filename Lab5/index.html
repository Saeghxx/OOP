<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lab5</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="stylesheet" href="src/style/style.css">
</head>
<body>

  <div id="titlebar">
    <span class="title-icon">🎨</span>
    <span id="titleText">Lab5</span>
    <div class="title-controls"><span>—</span><span>▢</span><span>×</span></div>
  </div>

  <div id="menubar">
    <div class="menu" id="menuFile">
      <button class="menu-btn">Файл</button>
      <div class="menu-dropdown">
        <div class="menu-item" id="itemClear">Очистити</div>
        <div class="menu-item" id="itemExportCSV">Зберегти в CSV</div>
        <div class="menu-item" id="itemExit">Вихід</div>
      </div>
    </div>

    <div class="menu" id="menuObjects">
      <button class="menu-btn">Об'єкти</button>
      <div class="menu-dropdown">
        <div class="menu-item" data-shape="point">Крапка</div>
        <div class="menu-item" data-shape="line">Лінія</div>
        <div class="menu-item" data-shape="rect">Прямокутник</div>
        <div class="menu-item" data-shape="ellipse">Еліпс</div>
        <div class="menu-item" data-shape="linecircles">Лінія з кружечками</div>
        <div class="menu-item" data-shape="cube">Каркас куба</div>
      </div>
    </div>

    <div class="menu" id="menuWindow">
      <button class="menu-btn">Вікно</button>
      <div class="menu-dropdown">
        <div class="menu-item" id="itemToggleTable">Таблиця об'єктів</div>
      </div>
    </div>

    <div class="menu" id="menuHelp">
      <button class="menu-btn">Довідка</button>
      <div class="menu-dropdown">
        <div class="menu-item" id="itemAbout">Про програму</div>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button class="tool-btn" data-shape="point" title="Крапка">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="black"/></svg>
    </button>
    <button class="tool-btn" data-shape="line" title="Лінія">
      <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="20" x2="20" y2="4" stroke="black" stroke-width="2"/></svg>
    </button>
    <button class="tool-btn" data-shape="rect" title="Прямокутник">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="6" width="16" height="12" fill="none" stroke="black" stroke-width="2"/></svg>
    </button>
    <button class="tool-btn" data-shape="ellipse" title="Еліпс">
      <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="12" cy="12" rx="9" ry="6" fill="none" stroke="black" stroke-width="2"/></svg>
    </button>
    <button class="tool-btn" data-shape="linecircles" title="Лінія з кружечками">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <line x1="5" y1="19" x2="19" y2="5" stroke="black" stroke-width="2"/>
        <circle cx="5" cy="19" r="3" fill="none" stroke="black" stroke-width="2"/>
        <circle cx="19" cy="5" r="3" fill="none" stroke="black" stroke-width="2"/>
      </svg>
    </button>
    <button class="tool-btn" data-shape="cube" title="Каркас куба">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <rect x="4" y="8" width="12" height="12" fill="none" stroke="black" stroke-width="1.5"/>
        <rect x="8" y="4" width="12" height="12" fill="none" stroke="black" stroke-width="1.5"/>
        <line x1="4" y1="8" x2="8" y2="4" stroke="black" stroke-width="1.5"/>
        <line x1="16" y1="8" x2="20" y2="4" stroke="black" stroke-width="1.5"/>
        <line x1="4" y1="20" x2="8" y2="16" stroke="black" stroke-width="1.5"/>
        <line x1="16" y1="20" x2="20" y2="16" stroke="black" stroke-width="1.5"/>
      </svg>
    </button>
  </div>

  <canvas id="drawArea" width="800" height="460"></canvas>

  <script type="module" src="src/lab5.js"></script>
</body>
</html>
